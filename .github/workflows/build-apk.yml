name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q GoonhoShakeTimer-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and watch APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug --stacktrace --no-daemon
      - name: Prepare installable APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/GoonhoShakeTimer-Phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/GoonhoShakeTimer-Watch.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/GoonhoShakeTimer-Phone.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/GoonhoShakeTimer-Watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoonhoShakeTimer-Phone
          path: dist/GoonhoShakeTimer-Phone.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GoonhoShakeTimer-Watch
          path: dist/GoonhoShakeTimer-Watch.apk
          if-no-files-found: error
          retention-days: 30
